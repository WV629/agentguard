[project]
name = "agentguard"
version = "0.1.0"
description = "Policy gateway between an AI agent and its NEAR wallet"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["py-near>=1.2.22", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
